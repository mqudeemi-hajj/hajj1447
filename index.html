<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خارطة الحجاج التفاعلية | محمد قديمي</title>
    <style>
        /* تعريف ألوان الهوية البصرية */
        :root {
            --primary-olive: #5A6E46;  
            --secondary-green: #A3C9A8; 
            --light-bg: #F9FBF9;        
            --white: #FFFFFF;
            --dark-text: #2C3E2B;
            --gray-text: #70826E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark-text);
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        /* الهيدر المطور */
        header {
            background-color: var(--white);
            text-align: center;
            padding: 20px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-bottom: 3px solid var(--primary-olive);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* حاوية صورة الشعار لضمان تناسق الحجم والجودة */
        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* يحافظ على أبعاد الشعار الأصلي دون تشويه */
        }

        header .logo-text {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-olive);
            letter-spacing: 0.5px;
        }

        header .subtitle {
            font-size: 13px;
            color: var(--gray-text);
            margin-top: 4px;
        }

        /* حاوية الخارطة */
        .road-map {
            max-width: 450px;
            margin: 30px auto;
            position: relative;
            padding: 10px 20px;
        }

        /* كتلة الصف الواحد */
        .road-row {
            display: flex;
            justify-content: space-around;
            position: relative;
            padding: 20px 0 70px 0;
        }

        /* السهم الأفقي الرابط بين محطتي الصف */
        .road-row::before {
            content: '➔';
            position: absolute;
            top: 35%;
            font-size: 28px;
            color: var(--secondary-green);
            z-index: 1;
            left: 46%;
            transform: scaleX(-1); 
        }

        /* الأسهم الانتقالية للنزول والالتفاف بين الصفوف */
        .road-row::after {
            position: absolute;
            font-size: 35px;
            color: var(--secondary-green);
            z-index: 1;
            line-height: 1;
        }

        /* النزول والالتفاف المتناسق */
        .row-1::after, .row-2::after, .row-3::after {
            content: '⤷';
            left: 15%;
            bottom: -25px;
            transform: scaleX(-1) rotate(90deg);
        }

        .row-4::after {
            display: none;
        }

        /* تصميم المحطة التفاعلية */
        .station-node {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 140px;
            cursor: pointer;
        }

        /* الدائرة الأساسية للمنسك */
        .circle-wrapper {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--white), #f5f8f5);
            border: 4px solid var(--primary-olive);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 8px 20px rgba(90, 110, 70, 0.12);
            transition: all 0.25s ease;
        }

        .station-node:active .circle-wrapper {
            transform: scale(0.92);
            background: var(--secondary-green);
            border-color: var(--secondary-green);
        }

        /* كرت العنوان السفلي */
        .station-info {
            text-align: center;
            margin-top: 12px;
            background-color: var(--white);
            padding: 8px 10px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid rgba(163, 201, 168, 0.25);
            width: 100%;
        }

        .station-number {
            font-size: 11px;
            font-weight: bold;
            color: var(--primary-olive);
            display: block;
            background-color: rgba(90, 110, 70, 0.08);
            width: fit-content;
            padding: 1px 8px;
            border-radius: 10px;
            margin: 0 auto 4px auto;
        }

        .station-name {
            font-size: 13px;
            font-weight: bold;
            color: var(--dark-text);
            white-space: nowrap;
        }

        /* النافذة المنبثقة للفيديو (Modal) */
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .video-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--white);
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            animation: slideUp 0.3s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(35px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 166px;
            padding: 16px;
            background-color: var(--primary-olive);
            color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--white);
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background-color: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--gray-text);
            background-color: var(--white);
            margin-top: 20px;
            border-top: 1px solid #edf2f7;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="شعار محمد قديمي">
        </div>
        <div class="logo-text">شركة مُحَمَّد خالد قَدِيمِي</div>
        <div class="subtitle"> الخارطة التفاعلية للمناسك</div>
    </header>

    <main class="road-map">

        <div class="road-row row-1">
            <div class="station-node" onclick="openVideo('01 الميقات 🗺️', 'https://www.youtube.com/embed/xHjm20EpVi8')">
                <div class="circle-wrapper">🗺️</div>
                <div class="station-info">
                    <span class="station-number">01</span>
                    <span class="station-name">الميقات</span>
                </div>
            </div>
            
            <div class="station-node" onclick="openVideo('02 أنواع النسك 📜', 'https://www.youtube.com/embed/uSFRK5mV86w')">
                <div class="circle-wrapper">📜</div>
                <div class="station-info">
                    <span class="station-number">02</span>
                    <span class="station-name">أنواع النسك</span>
                </div>
            </div>
        </div>

        <div class="road-row row-2">
            <div class="station-node" onclick="openVideo('03 محظورات الإحرام 🛑', 'https://www.youtube.com/embed/nSpe-CoJ_Kw')">
                <div class="circle-wrapper">🛑</div>
                <div class="station-info">
                    <span class="station-number">03</span>
                    <span class="station-name">محظورات الإحرام</span>
                </div>
            </div>

            <div class="station-node" onclick="openVideo('04 طواف القدوم والعمرة 🕋', 'https://www.youtube.com/embed/xTkoYKrMTAA')">
                <div class="circle-wrapper">🕋</div>
                <div class="station-info">
                    <span class="station-number">04</span>
                    <span class="station-name">طواف القدوم والعمرة</span>
                </div>
            </div>
        </div>

        <div class="road-row row-3">
            <div class="station-node" onclick="openVideo('05 يوم التروية ⛺', 'https://www.youtube.com/embed/H8LiVyRGzUc')">
                <div class="circle-wrapper">⛺</div>
                <div class="station-info">
                    <span class="station-number">05</span>
                    <span class="station-name">يوم التروية</span>
                </div>
            </div>

            <div class="station-node" onclick="openVideo('06 يوم عرفة 🤲', 'https://www.youtube.com/embed/99wqaohiTlg')">
                <div class="circle-wrapper">🤲</div>
                <div class="station-info">
                    <span class="station-number">06</span>
                    <span class="station-name">يوم عرفة</span>
                </div>
            </div>
        </div>

        <div class="road-row row-4">
            <div class="station-node" onclick="openVideo('07 المبيت بمزدلفة 🌌', 'https://www.youtube.com/embed/92hj7VGyhSo')">
                <div class="circle-wrapper">🌌</div>
                <div class="station-info">
                    <span class="station-number">07</span>
                    <span class="station-name">المبيت بمزدلفة</span>
                </div>
            </div>

            <div class="station-node" onclick="openVideo('08 أيام التشريق ✨', 'https://www.youtube.com/embed/chktQJub5KM')">
                <div class="circle-wrapper">✨</div>
                <div class="station-info">
                    <span class="station-number">08</span>
                    <span class="station-name">أيام التشريق</span>
                </div>
            </div>
        </div>

    </main>

    <div class="video-modal" id="videoModal" onclick="closeVideo()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">شرح المنسك</span>
                <button class="close-btn" onclick="closeVideo()">&times;</button>
            </div>
            <div class="video-container">
                <iframe id="youtubePlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 شركة محمد خالد قديمي .   اللجنة الثقافية.</p>
    </footer>

    <script>
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('youtubePlayer');
        const modalTitle = document.getElementById('modalTitle');

        function openVideo(title, videoUrl) {
            modalTitle.innerText = title;
            player.src = videoUrl; 
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function closeVideo() {
            modal.classList.remove('active');
            player.src = ''; 
            document.body.style.overflow = 'auto'; 
        }
    </script>
</body>
</html>
